<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="flex gap-5 h-screen flex-col justify-center items-center">
      <p id="count">0</p>

      <div>
        <button class="bg-green-500 px-5 py-2 rounded-lg" id="addBtn">+</button>
        <button class="bg-red-500 px-5 py-2 rounded-lg" id="subBtn">-</button>
        <button class="bg-blue-500 px-5 py-2 rounded-lg" id="resetBtn">reset</button>
      </div>
    </div>
  </body>
  <script>
    let count = document.getElementById("count")
    let addBtn = document.getElementById("addBtn")
    let subBtn = document.getElementById("subBtn")
    let resetBtn = document.getElementById("resetBtn")

    addBtn.addEventListener("click" , ()=>{
        count.innerText = parseInt(count.innerText) + 1;
    })

    subBtn.addEventListener("click" , ()=>{
        count.innerText = parseInt(count.innerText) - 1;
    })

    resetBtn.addEventListener("click" , ()=>{
        count.innerText = 0;
    })
  </script>
</html>
