<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex gap-5 h-screen flex-col justify-center items-center">
      <p id="count">0</p>

      <div>
        <button class="bg-green-500 px-5 py-2 rounded-lg" id="startBtn">Start</button>
        <button class="bg-red-500 px-5 py-2 rounded-lg" id="stopBtn">Stop</button>
        <button class="bg-blue-500 px-5 py-2 rounded-lg" id="resetBtn">reset</button>
      </div>
    </div>
</body>
<script>
    let count = document.getElementById("count")
    let startBtn = document.getElementById("startBtn")
    let stopBtn = document.getElementById("stopBtn")
    let resetBtn = document.getElementById("resetBtn")

    let interval;

    startBtn.addEventListener("click" , ()=>{
        interval = setInterval(()=>{
            count.innerText = parseInt(count.innerText) + 1;
        } , 1000)
    })

    stopBtn.addEventListener("click" , ()=>{
        clearInterval(interval)
    })

    resetBtn.addEventListener("click" , ()=>{
        clearInterval(interval)
        count.innerText = 0;
    })

    
</script>
</html>
